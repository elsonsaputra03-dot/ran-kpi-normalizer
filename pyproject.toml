[project]
name = "ran-kpi-normalizer"
version = "0.1.0"
description = "Normalize multi-vendor LTE PM counters to 3GPP TS 32.425 measurements and compute TS 32.450 KPIs, with data quality checks."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["duckdb>=1.0", "pyyaml>=6.0", "pandas>=2.0", "pyarrow>=14"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ranorm = "ranorm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ranorm"]
