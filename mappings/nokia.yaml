# Nokia LTE -> model counter seragam. Sebagian terisi: hanya counter yang namanya muncul di beberapa referensi publik independen.
# Isi expr dengan nama PM counter Nokia dari dokumentasi vendor atau pengetahuan Anda sendiri (bukan dari dokumen/berkas
# milik operator atau pemberi kerja), lalu ubah status menjadi verified. Pipeline melewati vendor yang counter wajibnya
# belum terisi dan melaporkannya.
vendor: nokia
technology: lte
export: {granularity_minutes: 60, time_column: null, time_format: null, timezone_offset_hours: 0, cell_column: null}
